[project]
name = "shiftforge"
version = "0.4.0"
description = "Shift Schedule Generation Automation Module"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shiftforge = "shiftforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftforge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]
